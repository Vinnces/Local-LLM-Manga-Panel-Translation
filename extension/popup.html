<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 280px;
    margin: 0;
    padding: 12px;
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1e1e1e;
    color: #eeeeee;
  }
  .title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 8px 0;
  }
  .host {
    font-size: 12px;
    color: #aaaaaa;
    margin: 0 0 12px 0;
    word-break: break-all;
  }
  button {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    background: #1565c0;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover:not(:disabled) {
    background: #1976d2;
  }
  button:disabled {
    background: #555555;
    cursor: default;
  }
  .status {
    margin-top: 10px;
    font-size: 12px;
    color: #9e9e9e;
    min-height: 16px;
    word-break: break-word;
  }
  .status.ok { color: #66bb6a; }
  .status.err { color: #ef5350; }
</style>
</head>
<body>
  <p class="title">Translate full manga page</p>
  <p class="host" id="host">Detecting page image…</p>
  <button id="go" disabled>Translate</button>
  <p class="status" id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
